# Secrets Scanning — 2.3
# Triggers: push (all branches), pull_request

name: Secrets Scan

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read
  # Required to surface TruffleHog findings in the Security tab
  security-events: write

jobs:
  # ── TruffleHog OSS ──────────────────────────────────────────────────────────
  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0   # full history so TruffleHog can scan all commits

      - name: TruffleHog OSS scan
        uses: trufflesecurity/trufflehog@main
        with:
          # On PRs scan only the diff; on push scan all commits since base
          extra_args: >-
            --only-verified
            --fail
        env:
          # Suppress noise from test fixtures and known-safe patterns
          TRUFFLEHOG_EXCLUDE_PATHS: .trufflehog-ignore

      - name: Upload TruffleHog SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@9e8d0789d4a0fa9ceb6b1738f7e269594bdd67f0 # v3.28.9
        with:
          sarif_file: trufflehog.sarif
          category: trufflehog
        continue-on-error: true  # SARIF upload is best-effort; fail is set above
