# Secrets Scanning — 2.3
# Triggers: push (all branches), pull_request

name: Secrets Scan

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read
  # Required to surface TruffleHog findings in the Security tab
  security-events: write

jobs:
  # ── TruffleHog OSS ──────────────────────────────────────────────────────────
  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0   # full history so TruffleHog can scan all commits

      - name: TruffleHog OSS scan
        uses: trufflesecurity/trufflehog@main
        with:
          # The action passes --fail automatically; do not repeat it in extra_args.
          # --only-verified suppresses unverified/speculative findings.
          extra_args: --only-verified
          # Suppress noise from test fixtures and known-safe patterns
          exclude_paths: .trufflehog-ignore
