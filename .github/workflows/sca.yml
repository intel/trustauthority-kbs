# Dependency & Supply-Chain Security (SCA) — 2.2
# Triggers: pull_request, scheduled weekly (Monday 03:00 UTC)

name: SCA

on:
  pull_request:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.step1.outputs.runner }}
    steps:
      - name: Detect runner
        id: step1
        run: |
          if [ ${{ github.repository }} == 'intel/trustauthority-kbs' ]; then
            echo "runner=ubuntu-latest" >> $GITHUB_OUTPUT
          else
            echo "runner=self-hosted" >> $GITHUB_OUTPUT
          fi

  # ── govulncheck — official Go CVE scanner ───────────────────────────────────
  govulncheck:
    name: govulncheck
    needs: [setup]
    runs-on: ${{ needs.setup.outputs.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run govulncheck
        uses: golang/govulncheck-action@b625fbe08f3bccbe446d94fbf87fcc875a4f50ee # v1.0.4
        with:
          go-version-input: '1.24'
          go-package: ./...

  # ── License compliance ───────────────────────────────────────────────────────
  license-check:
    name: License Compliance
    needs: [setup]
    runs-on: ${{ needs.setup.outputs.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: '1.24'
          cache: true

      - name: Install go-licenses
        run: go install github.com/google/go-licenses@latest

      - name: Check licenses
        # Disallow licenses incompatible with BSD-3-Clause (the project's license).
        # AGPL/GPL/LGPL copyleft licenses are flagged; adjust the list as needed.
        run: |
          go-licenses check ./... \
            --disallowed_types=forbidden,restricted \
            --ignore intel/kbs/v1

      - name: Generate license report
        if: always()
        run: go-licenses report ./... --ignore intel/kbs/v1 > licenses.csv

      - name: Upload license report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: license-report
          path: licenses.csv
          retention-days: 30

  # ── OSV-Scanner — broader CVE / advisory database ───────────────────────────
  osv-scan:
    name: OSV Scanner
    needs: [setup]
    runs-on: ${{ needs.setup.outputs.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@main
        with:
          scan-args: |-
            --lockfile=go.sum
            --recursive
            --format=sarif
            --output=osv-results.sarif
        continue-on-error: true

      - name: Upload OSV SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@9e8d0789d4a0fa9ceb6b1738f7e269594bdd67f0 # v3.28.9
        with:
          sarif_file: osv-results.sarif
          category: osv-scanner
